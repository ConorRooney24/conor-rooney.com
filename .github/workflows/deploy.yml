name: Deploy website

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy release to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: RELEASE_TAG
          script: |
            /usr/local/bin/deploy-website "$RELEASE_TAG"
